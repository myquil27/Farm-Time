<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farm Time</title>
<meta name="description" content="Who's going up to the farm, when, and why.">
<meta name="theme-color" content="#f8c98f">
<meta name="apple-mobile-web-app-title" content="Farm Time">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23b8412d' d='M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z'/%3E%3Cpath d='M9 21v-6.5h6V21M9 14.5 15 21M15 14.5 9 21' stroke='%23fff6ea' stroke-width='1.4' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap">
<style>
/* Layout: a golden-hour farm landscape across the top holds the greeting and today's status;
   below it, soft cards for who's up there now, then the upcoming log or a month calendar */
:root {
  --bg: #fdf8f1;
  --surface: #ffffff;
  --ink: #2d241c;
  --muted: #7c6c5c;
  --line: #eee4d6;
  --accent: #46703f;
  --accent-ink: #ffffff;
  --accent-soft: #e9f0e1;
  --sun: #f0ac2e;
  --barn: #b8412d;
  --barn-roof: #7e2b20;
  --barn-trim: #fff6ea;
  --window: #fff6ea;
  --danger: #b3261e;
  --sky-top: #f8c98f;
  --sky-mid: #fbe3c2;
  --sky-low: #fdf1df;
  --hill-far: #cfdcae;
  --hill-mid: #a5c283;
  --hill-tree: #7fa35f;
  --fence: #b59a78;
  --cloud-o: .85;
  --stars-o: 0;
  --chip-bg-l: 92%;
  --chip-fg-l: 28%;
  --chip-dot-l: 45%;
  --chip-dot-ink: #ffffff;
  --shadow-1: rgb(90 60 30 / .06);
  --shadow-2: rgb(90 60 30 / .09);
  --scrim: rgb(45 30 15 / .45);
  --f-display: "Young Serif", "Iowan Old Style", Georgia, serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17140f; --surface: #221d17; --ink: #f4ece0; --muted: #b5a691; --line: #362e25;
    --accent: #9fcb8b; --accent-ink: #152112; --accent-soft: #263222; --sun: #efe6c9;
    --barn: #6e2a1f; --barn-roof: #4a1b14; --barn-trim: #a8957c; --window: #f5b843; --danger: #f28b82;
    --sky-top: #141a33; --sky-mid: #2a2a45; --sky-low: #3b3247;
    --hill-far: #2f3a2c; --hill-mid: #243121; --hill-tree: #1d2919; --fence: #5d4f3e;
    --cloud-o: 0; --stars-o: .9;
    --chip-bg-l: 22%; --chip-fg-l: 85%; --chip-dot-l: 62%; --chip-dot-ink: #17140f;
    --shadow-1: rgb(0 0 0 / .25); --shadow-2: rgb(0 0 0 / .35); --scrim: rgb(0 0 0 / .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17140f; --surface: #221d17; --ink: #f4ece0; --muted: #b5a691; --line: #362e25;
  --accent: #9fcb8b; --accent-ink: #152112; --accent-soft: #263222; --sun: #efe6c9;
  --barn: #6e2a1f; --barn-roof: #4a1b14; --barn-trim: #a8957c; --window: #f5b843; --danger: #f28b82;
  --sky-top: #141a33; --sky-mid: #2a2a45; --sky-low: #3b3247;
  --hill-far: #2f3a2c; --hill-mid: #243121; --hill-tree: #1d2919; --fence: #5d4f3e;
  --cloud-o: 0; --stars-o: .9;
  --chip-bg-l: 22%; --chip-fg-l: 85%; --chip-dot-l: 62%; --chip-dot-ink: #17140f;
  --shadow-1: rgb(0 0 0 / .25); --shadow-2: rgb(0 0 0 / .35); --scrim: rgb(0 0 0 / .6);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15.5px; line-height: 1.55; }
:focus-visible { outline: 2.5px solid var(--sun); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; font-weight: 400; }
svg.ic { width: 16px; height: 16px; flex: none; }

/* ---------- Hero landscape ---------- */
.hero { padding-top: calc(18px + env(safe-area-inset-top, 0px)) !important; position: relative; overflow: hidden; background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-low) 100%); padding-inline: 16px; padding-block: 18px 200px; }
.scene { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 190px; display: block; }
.scene .far { fill: var(--hill-far); }
.scene .mid { fill: var(--hill-mid); }
.scene .tree { fill: var(--hill-tree); }
.scene .ground { fill: var(--bg); }
.scene .sun { fill: var(--sun); }
.scene .barn { fill: var(--barn); }
.scene .roof { fill: var(--barn-roof); }
.scene .trim { stroke: var(--barn-trim); fill: none; stroke-width: 2; }
.scene .window { fill: var(--window); }
.scene .fence { stroke: var(--fence); stroke-width: 3; stroke-linecap: round; fill: none; }
.scene .clouds { fill: #fffaf2; opacity: var(--cloud-o); }
.scene .stars { fill: #fff8e6; opacity: var(--stars-o); }
.hero-in { position: relative; max-width: 880px; margin: 0 auto; display: grid; gap: 28px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; margin: 0; font-family: var(--f-display); font-size: 1.35rem; color: var(--ink); }
.brand .mark { width: 36px; height: 36px; border-radius: 11px; background: var(--surface); display: grid; place-items: center; color: var(--barn); box-shadow: 0 2px 8px var(--shadow-2); }
.greet { display: grid; gap: 8px; max-width: 640px; }
.eyebrow { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.greet h1 { font-family: var(--f-display); font-size: clamp(1.9rem, 5.4vw, 2.9rem); line-height: 1.12; margin: 0; letter-spacing: -.01em; }
.greet .sub { color: var(--ink); opacity: .82; font-size: 1.02rem; }
.sub { margin: 0; color: var(--muted); max-width: 62ch; }
.sub strong { color: var(--ink); font-weight: 700; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: inherit; font-weight: 600; border-radius: 999px; padding: 10px 18px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; min-height: 44px; transition: transform .12s ease, box-shadow .12s ease, background-color .12s ease; }
.btn:hover { box-shadow: 0 3px 10px var(--shadow-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: 0 3px 10px var(--shadow-2); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); box-shadow: none; }
.btn.ghost:hover { color: var(--ink); background: var(--accent-soft); }
.btn.icon { width: 44px; padding: 0; }
.btn.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: var(--surface); }
.btn:disabled { opacity: .55; cursor: default; }

/* ---------- Page body ---------- */
.wrap { max-width: 880px; margin: 0 auto; padding-inline: 16px; padding-block: 0 80px; display: grid; gap: 22px; position: relative; }
.card { background: var(--surface); border-radius: 20px; box-shadow: 0 1px 2px var(--shadow-1), 0 8px 28px var(--shadow-2); }
.today { margin-top: -84px; padding: 20px; display: grid; gap: 14px; }
.section-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.section-h h2 { font-family: var(--f-display); font-size: 1.3rem; margin: 0; }
.live { display: inline-flex; align-items: center; gap: 7px; font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 4px var(--accent-soft); }
.lock { margin-top: -84px; padding: 24px; }
.lock-form { display: grid; gap: 14px; max-width: 460px; }
.lock-form h2 { font-family: var(--f-display); font-size: 1.4rem; margin: 0; }
.code-row { display: flex; gap: 8px; flex-wrap: wrap; }
.code-row input { flex: 1 1 200px; font-size: 1.05rem; letter-spacing: .02em; }
.foot { display: flex; justify-content: center; padding-top: 8px; }
.notice { background: var(--accent-soft); border-radius: 14px; padding: 12px 16px; font-size: .94rem; }

/* People chips: hue comes from the name, lightness from theme tokens */
.people { display: flex; flex-wrap: wrap; gap: 6px; }
.person { --h: 30; display: inline-flex; align-items: center; gap: 7px; padding: 3px 12px 3px 3px; border-radius: 999px; background: hsl(var(--h) 45% var(--chip-bg-l)); color: hsl(var(--h) 45% var(--chip-fg-l)); font-weight: 600; font-size: .92rem; max-width: 100%; }
.person .ini { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; flex: none; background: hsl(var(--h) 45% var(--chip-dot-l)); color: var(--chip-dot-ink); font-size: .74rem; font-weight: 700; }
.person .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; color: var(--muted); font-size: .9rem; }
.tag { display: inline-flex; align-items: center; gap: 6px; }
.tag.reason { color: var(--ink); font-weight: 600; }
.tag.reason .ic { color: var(--accent); }
.tag.stay { color: var(--muted); }

/* Tabs */
.bar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.tabs { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--accent-soft); }
.tab { font: inherit; font-weight: 600; border: 0; background: transparent; color: var(--muted); padding: 8px 18px; border-radius: 999px; cursor: pointer; min-height: 40px; }
.tab[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px var(--shadow-2); }
.tab .count { display: inline-block; margin-left: 6px; min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: .74rem; line-height: 20px; text-align: center; font-variant-numeric: tabular-nums; }

/* Farm to-dos */
.todos { padding: 18px; display: grid; gap: 14px; }
.todo-add { display: flex; gap: 8px; }
.todo-list { display: grid; gap: 8px; }
.todo { display: flex; align-items: flex-start; gap: 12px; padding: 12px; border-radius: 14px; background: var(--bg); }
.check { flex: none; width: 28px; height: 28px; margin-top: 1px; display: grid; place-items: center; border: 2px solid var(--accent); border-radius: 50%; background: transparent; color: var(--accent-ink); cursor: pointer; }
.check[aria-checked="true"] { background: var(--accent); }
.check:hover { background: var(--accent-soft); }
.check[aria-checked="true"]:hover { filter: brightness(1.08); background: var(--accent); }
.todo-body { flex: 1; min-width: 0; display: grid; gap: 6px; padding: 2px 0; border: 0; background: none; font: inherit; color: inherit; text-align: left; cursor: pointer; }
.todo-text { font-weight: 600; overflow-wrap: anywhere; }
.todo.is-done .todo-text { text-decoration: line-through; color: var(--muted); font-weight: 500; }
.due { display: inline-flex; align-items: center; gap: 6px; }
.due.late { color: var(--danger); font-weight: 600; }
.todo-hint { justify-self: start; justify-content: flex-start; text-align: left; padding-inline: 10px; }
details.done-list summary { cursor: pointer; font-weight: 600; color: var(--muted); padding: 6px 0; }
details.done-list .todo-list { margin-top: 6px; }
.done-foot { display: flex; justify-content: flex-end; margin-top: 4px; }

/* Trip rows */
.list { display: grid; gap: 12px; }
.group-h { font-family: var(--f-display); font-size: 1.15rem; margin: 12px 0 0; color: var(--muted); }
.trip { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 16px; align-items: start; width: 100%; text-align: left; font: inherit; color: inherit; padding: 14px; border: 0; border-radius: 18px; background: var(--surface); cursor: pointer; box-shadow: 0 1px 2px var(--shadow-1), 0 4px 16px var(--shadow-1); transition: transform .14s ease, box-shadow .14s ease; }
.trip:hover { transform: translateY(-1px); box-shadow: 0 1px 2px var(--shadow-1), 0 10px 26px var(--shadow-2); }
.today .trip { box-shadow: none; background: var(--bg); }
.datebox { display: grid; text-align: center; border-radius: 12px; overflow: hidden; font-variant-numeric: tabular-nums; background: var(--accent-soft); }
.datebox .dow { background: var(--accent); color: var(--accent-ink); font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; padding: 3px 0; }
.datebox .dnum { font-family: var(--f-display); font-size: 1.5rem; line-height: 1.3; }
.datebox .mon { font-size: .66rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; padding-bottom: 4px; }
.trip .body { display: grid; gap: 7px; min-width: 0; }
.notes { font-size: .93rem; overflow-wrap: anywhere; white-space: pre-line; color: var(--ink); opacity: .85; }
.empty { padding: 26px 22px; display: grid; gap: 12px; justify-items: start; text-align: left; }
.empty h2 { font-family: var(--f-display); margin: 0; font-size: 1.35rem; }
details.past { margin-top: 6px; }
details.past summary { cursor: pointer; font-weight: 600; color: var(--muted); padding: 8px 0; }
details.past .list { margin-top: 6px; }
details.past .trip { opacity: .75; }

/* Calendar */
.cal { padding: 18px; display: grid; gap: 14px; }
.cal-head { display: flex; align-items: center; gap: 6px; }
.cal-head h2 { font-family: var(--f-display); margin: 0 auto 0 0; font-size: 1.35rem; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.wd { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); text-align: center; font-weight: 700; padding-bottom: 2px; }
.day { height: 90px; overflow: hidden; min-width: 0; border: 0; border-radius: 12px; background: var(--bg); padding: 5px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; font: inherit; color: inherit; text-align: left; transition: background-color .12s ease; }
.day:hover { background: var(--accent-soft); }
.day.out { opacity: .4; }
.day .n { font-size: .82rem; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 24px; height: 24px; display: grid; place-items: center; border-radius: 999px; align-self: flex-start; }
.day.is-today { background: var(--accent-soft); }
.day.is-today .n { color: var(--accent); font-weight: 800; }
.day.is-sel { box-shadow: inset 0 0 0 1.5px var(--accent); }
.bar { --h: 30; display: block; font-size: .72rem; line-height: 1.4; padding: 1px 6px; border-radius: 6px; background: hsl(var(--h) 45% var(--chip-bg-l)); color: hsl(var(--h) 45% var(--chip-fg-l)); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.more { font-size: .7rem; color: var(--muted); padding-left: 4px; }
.dayinfo { display: grid; gap: 12px; border-top: 1px solid var(--line); padding-top: 14px; }
.dayinfo-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.dayinfo-h h3 { font-family: var(--f-display); margin: 0; font-size: 1.15rem; }
.dayinfo .trip { box-shadow: none; background: var(--bg); }
@media (max-width: 560px) {
  .cal { padding: 14px 10px; }
  .grid { gap: 3px; }
  .day { height: 56px; padding: 3px; border-radius: 9px; }
  .bar { font-size: 0; height: 6px; padding: 0; border-radius: 3px; background: hsl(var(--h) 45% var(--chip-dot-l)); }
  .more { font-size: .62rem; padding: 0; }
  .hero { padding-bottom: 180px; }
  .scene { height: 170px; }
}

/* ---------- Trip form ---------- */
dialog { border: 0; border-radius: 24px; padding: 0; background: var(--surface); color: var(--ink); width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); box-shadow: 0 30px 80px var(--shadow-2); }
dialog::backdrop { background: var(--scrim); }
.form { display: grid; gap: 20px; padding: 24px; }
.form-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.form h2 { font-family: var(--f-display); margin: 0; font-size: 1.55rem; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; display: grid; gap: 10px; }
legend, .lab { font-weight: 700; padding: 0; margin-bottom: 10px; font-size: .95rem; }
.field { display: grid; gap: 6px; min-width: 0; }
.field .lab { margin: 0; }
input[type="text"], input[type="date"], textarea { font: inherit; padding: 11px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); width: 100%; min-width: 0; transition: border-color .12s ease; }
input:focus, textarea:focus { border-color: var(--accent); outline: none; }
textarea { resize: vertical; min-height: 76px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.pick { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { display: inline-flex; align-items: center; gap: 7px; font: inherit; font-size: .93rem; font-weight: 500; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 14px; cursor: pointer; min-height: 38px; }
.opt .ic { color: var(--accent); }
.opt:hover { border-color: var(--accent); }
.opt[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opt[aria-pressed="true"] .ic { color: currentColor; }
.addname { display: flex; gap: 8px; }
.going { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-height: 54px; padding: 9px; border-radius: 14px; background: var(--bg); }
.going .person { font-size: .95rem; padding-right: 3px; }
.going .x { display: grid; place-items: center; width: 26px; height: 26px; margin-left: 1px; border: 0; border-radius: 50%; background: transparent; color: inherit; cursor: pointer; }
.going .x:hover { background: hsl(var(--h) 45% var(--chip-dot-l) / .22); }
.going .x .ic { width: 14px; height: 14px; }
.going > .hint { padding-inline: 6px; }
.opt.add { border-style: dashed; color: var(--muted); }
.opt.add:hover { color: var(--ink); border-style: solid; }
.check { display: flex; align-items: center; gap: 12px; font-weight: 600; cursor: pointer; padding: 12px 14px; border-radius: 12px; background: var(--bg); }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.hint { font-size: .86rem; color: var(--muted); margin: 0; font-weight: 400; }
.overlap { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; font-size: .92rem; display: grid; gap: 4px; }
.overlap strong { font-weight: 700; }
.err { color: var(--danger); font-weight: 600; margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
.actions .left { margin-right: auto; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 11px 20px; border-radius: 999px; font-weight: 600; box-shadow: 0 10px 30px var(--shadow-2); max-width: calc(100vw - 32px); }
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: rise .22s ease-out; }
  @keyframes rise { from { transform: translate(-50%, 10px); opacity: 0; } }
  .scene .clouds { animation: drift 60s linear infinite alternate; }
  @keyframes drift { to { transform: translateX(40px); } }
}
@media (prefers-reduced-motion: reduce) { .trip, .btn { transition: none; } }
</style>
</head>
<body>
<header class="hero">
  <svg class="scene" viewBox="0 0 1440 230" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <g class="stars">
      <circle cx="120" cy="40" r="1.6"/><circle cx="260" cy="90" r="1.2"/><circle cx="410" cy="30" r="1.8"/><circle cx="560" cy="70" r="1.2"/>
      <circle cx="700" cy="24" r="1.5"/><circle cx="880" cy="56" r="1.3"/><circle cx="990" cy="20" r="1.8"/><circle cx="1130" cy="66" r="1.2"/>
      <circle cx="1260" cy="34" r="1.6"/><circle cx="1380" cy="80" r="1.3"/><circle cx="620" cy="110" r="1"/><circle cx="780" cy="96" r="1.1"/>
    </g>
    <circle class="sun" cx="660" cy="104" r="36"/>
    <g class="clouds">
      <ellipse cx="300" cy="64" rx="56" ry="14"/><ellipse cx="330" cy="54" rx="30" ry="14"/>
      <ellipse cx="1090" cy="44" rx="64" ry="13"/><ellipse cx="1060" cy="35" rx="30" ry="13"/>
      <ellipse cx="760" cy="40" rx="40" ry="9"/>
    </g>
    <path class="far" d="M0 128 C 180 84, 360 96, 540 118 S 880 70, 1080 96 S 1340 78, 1440 100 V230 H0 Z"/>
    <g class="tree">
      <circle cx="430" cy="104" r="12"/><circle cx="448" cy="108" r="9"/><circle cx="1200" cy="86" r="11"/><circle cx="1216" cy="90" r="8"/>
      <circle cx="212" cy="98" r="10"/>
    </g>

    <g>

      <polygon class="roof" points="782,101 794,80 819,69 844,80 856,101"/>
      <rect class="window" x="813" y="83" width="12" height="9" rx="1.5"/>
      <rect class="trim" x="808" y="113" width="22" height="27"/>
      <path class="trim" d="M808 113 L830 140 M830 113 L808 140"/>

<script src="config.js"></script>
<script>
(() => {
  const ICON_PATHS = {
    chores: '<path d="M12 21v-9"/><path d="M12 12c0-4 3-7 8-7 0 5-3 7-8 7z"/><path d="M12 14c0-3-2-6-7-6 0 4 2 6 7 6z"/>',
    project: '<path d="M14.5 3.5l6 6-3 3-6-6z"/><path d="M12.5 8.5 3.5 17.5l3 3 9-9"/>',
    hunting: '<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>',
    relax: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/>',
    gathering: '<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><path d="M15.5 14.2c3 0 5.5 2 5.5 5.3"/>',
    other: '<path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.2"/>',
    x: '<path d="M6 6l12 12M18 6 6 18"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    list: '<path d="M10 6h10M10 12h10M10 18h10"/><path d="M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5L7.5 11M3.5 18l1.5 1.5L7.5 17"/>',
    moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  };
  function icon(name) {
    const s = document.createElement("span");
    s.style.display = "inline-flex";
    s.setAttribute("aria-hidden", "true");
    s.innerHTML = `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[name] || ICON_PATHS.other}</svg>`;
    return s;
  }

  const REASONS = [
    { id: "chores", label: "Chores & upkeep" },
    { id: "project", label: "Repairs & projects" },
    { id: "hunting", label: "Hunting" },
    { id: "relax", label: "Getting away" },
    { id: "gathering", label: "Family gathering" },
    { id: "other", label: "Other" },
  ];
  const reasonLabel = id => (REASONS.find(r => r.id === id) || REASONS[REASONS.length - 1]).label;

  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem("farmtime." + k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem("farmtime." + k, JSON.stringify(v)); } catch {} },
  };

  const S = {
    trips: [], status: "loading", family: null, canWrite: true,
    view: ["cal", "todo"].includes(store.get("view")) ? store.get("view") : "list", month: null, selDay: null,
    todos: [], todosError: null, doneOpen: false,
  };

  // ---- dates (local calendar days as YYYY-MM-DD strings) ----
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const today = () => ymd(new Date());
  const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
  const fmt = (s, o) => parse(s).toLocaleDateString(undefined, o);
  const SHORT = { weekday: "short", month: "short", day: "numeric" };
  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  const rangeText = x => x.start === x.end ? fmt(x.start, SHORT) : `${fmt(x.start, SHORT)} – ${fmt(x.end, SHORT)}`;
  const durText = x => { const n = diffDays(x.start, x.end); return n === 0 ? "Day trip" : `${n + 1} days`; };
  function relDay(s) {
    const n = diffDays(today(), s);
    if (n === 0) return "today";
    if (n === 1) return "tomorrow";
    if (n < 7) return "on " + fmt(s, { weekday: "long" });
    return "on " + fmt(s, SHORT);
  }
  function greeting() {
    const hr = new Date().getHours();
    return hr < 5 ? "Good evening" : hr < 12 ? "Good morning" : hr < 17 ? "Good afternoon" : "Good evening";
  }
  const byStart = (a, b) => a.start < b.start ? -1 : a.start > b.start ? 1 : a.end < b.end ? -1 : 1;

  // ---- helpers ----
  const $ = s => document.querySelector(s);
  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "style") el.style.cssText = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
    return el;
  }
  function hue(name) { let x = 7; for (const ch of name.toLowerCase()) x = (x * 31 + ch.charCodeAt(0)) >>> 0; return x % 360; }
  const uniq = arr => { const seen = new Set(); return arr.filter(n => { const k = n.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; }); };
  function joinNames(names) {
    names = uniq(names);
    if (names.length <= 1) return names[0] || "";
    return names.slice(0, -1).join(", ") + " & " + names[names.length - 1];
  }
  const chip = name => h("span", { class: "person", style: `--h:${hue(name)}` },
    h("span", { class: "ini", "aria-hidden": "true" }, name.trim()[0].toUpperCase()), h("span", { class: "nm" }, name));
  const reasonTag = id => h("span", { class: "tag reason" }, icon(id), reasonLabel(id));
  const stayTag = () => h("span", { class: "tag stay" }, icon("moon"), "Staying over");

  function clean(id, d) {
    if (!d || !DATE_RE.test(d.start) || !DATE_RE.test(d.end)) return null;
    const people = uniq(Array.isArray(d.people) ? d.people.filter(p => typeof p === "string" && p.trim()).map(p => p.trim().slice(0, 40)) : []).slice(0, 20);
    if (!people.length) return null;
    return {
      id, people, start: d.start, end: d.end < d.start ? d.start : d.end,
      reason: REASONS.some(r => r.id === d.reason) ? d.reason : "other",
      staying: !!d.staying,
      notes: typeof d.notes === "string" ? d.notes.slice(0, 500) : "",
      createdAt: typeof d.createdAt === "number" ? d.createdAt : null,
    };
  }

  let toastTimer;
  function toast(msg) {
    document.querySelector(".toast")?.remove();
    const el = h("div", { class: "toast", role: "status" }, msg);
    document.body.append(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.remove(), 2600);
  }

  // ---- render ----
  const hereToday = () => { const t = today(); return S.trips.filter(x => x.start <= t && x.end >= t).sort(byStart); };
  const nextTrip = () => { const t = today(); return S.trips.filter(x => x.start > t).sort(byStart)[0] || null; };

  function render() {
    const locked = S.status === "locked";
    const ready = S.status === "ready";
    $("#addBtn").hidden = !ready;
    $("#lock").hidden = !locked;
    $("#today").hidden = locked;
    $(".bar-row").hidden = !ready;
    $("#foot").hidden = !ready;
    const notice = $("#notice");
    notice.hidden = !(S.status === "ready" && !S.canWrite);
    notice.textContent = "You can see the schedule, but you can't add or change trips yet. Ask whoever shared this page to give you Editor access.";
    $("#tabList").setAttribute("aria-pressed", S.view === "list");
    $("#tabCal").setAttribute("aria-pressed", S.view === "cal");
    $("#listView").hidden = !ready || S.view !== "list";
    $("#calView").hidden = !ready || S.view !== "cal";
    $("#tabTodo").setAttribute("aria-pressed", S.view === "todo");
    $("#todoView").hidden = !ready || S.view !== "todo";
    const open = openTodos().length;
    $("#todoCount").hidden = !open;
    $("#todoCount").textContent = String(open);
    renderGreet();
    renderToday();
    if (S.view === "list") renderList(); else if (S.view === "cal") renderCal(); else renderTodos();
  }

  function renderGreet() {
    const el = $("#greet");
    const t = today();
    el.replaceChildren(h("div", { class: "eyebrow" }, `${greeting()} · ${fmt(t, { weekday: "long", month: "long", day: "numeric" })}`));
    if (S.status === "loading") { el.append(h("h1", {}, "Checking who's up at the farm…")); return; }
    if (S.status !== "ready") {
      el.append(h("h1", {}, "Welcome to the farm."));
      if (S.status === "locked") el.append(h("p", { class: "sub" }, "Enter your family code to see who's heading up and to plan your own visits."));
      return;
    }
    const here = hereToday();
    if (here.length) {
      const names = uniq(here.flatMap(x => x.people));
      el.append(h("h1", {}, `${joinNames(names)} ${names.length > 1 ? "are" : "is"} at the farm today.`));
      return;
    }
    el.append(h("h1", {}, "The farm's quiet today."));
    const next = nextTrip();
    el.append(next
      ? h("p", { class: "sub" }, h("strong", {}, joinNames(next.people)), ` ${next.people.length > 1 ? "head" : "heads"} up ${relDay(next.start)}.`)
      : h("p", { class: "sub" }, "Nothing on the calendar yet. Be the first to plan a visit."));
  }

  function renderToday() {
    const el = $("#today");
    el.replaceChildren();
    if (S.status === "loading") { el.append(h("p", { class: "sub" }, "Opening the family log…")); return; }
    if (S.status === "locked") return;
    if (S.status === "setup") {
      el.append(h("div", { class: "section-h" }, h("h2", {}, "Almost ready")),
        h("p", { class: "sub" }, "This copy of Farm Time isn't connected to a database yet. Add your Firebase settings to config.js, as described in the README."));
      return;
    }
    if (S.status === "error") {
      el.append(h("div", { class: "section-h" }, h("h2", {}, "Couldn't reach the family log")), h("p", { class: "sub" }, "Check your internet connection, then reload the page."));
      return;
    }
    if (!S.trips.length) {
      el.append(h("div", { class: "empty" },
        h("h2", {}, "Start the family log"),
        h("p", { class: "sub" }, "Add the first visit: who's going, which days, and what for. Everyone with this page sees it right away."),
        S.canWrite && h("button", { class: "btn primary", type: "button", onclick: () => openForm() }, "Plan a visit")));
      return;
    }
    const here = hereToday();
    if (here.length) {
      el.append(h("div", { class: "section-h" }, h("h2", {}, "Up there now"), h("span", { class: "live" }, "Today")), ...here.map(x => tripRow(x, true)));
    } else {
      const next = nextTrip();
      if (next) el.append(h("div", { class: "section-h" }, h("h2", {}, "Next visit"), h("span", { class: "sub" }, relDay(next.start).replace(/^on /, ""))), tripRow(next));
      else el.append(h("div", { class: "section-h" }, h("h2", {}, "No visits planned")),
        h("p", { class: "sub" }, "Nobody's on the calendar. Heading up soon? Add it so everyone knows."));
    }
    const open = openTodos().length;
    if (open) el.append(h("button", {
      class: "btn ghost todo-hint", type: "button",
      onclick: () => { S.view = "todo"; store.set("view", "todo"); render(); $("#todoView").scrollIntoView({ behavior: "smooth", block: "start" }); },
    }, icon("list"), `${open} farm to-do${open > 1 ? "s" : ""} waiting${here.length ? " while you're up there" : ""}`));
  }

  function tripRow(x, now) {
    const t = today();
    return h("button", { class: "trip", type: "button", onclick: () => openForm(x) },
      h("span", { class: "datebox", "aria-hidden": "true" },
        h("span", { class: "dow" }, now ? "Until" : fmt(x.start, { weekday: "short" })),
        h("span", { class: "dnum" }, String(parse(now ? x.end : x.start).getDate())),
        h("span", { class: "mon" }, fmt(now ? x.end : x.start, { month: "short" }))),
      h("span", { class: "body" },
        h("span", { class: "people" }, x.people.map(chip)),
        h("span", { class: "meta" },
          reasonTag(x.reason),
          h("span", {}, now ? (x.end === t ? "Leaving today" : "Leaving " + fmt(x.end, SHORT)) : rangeText(x)),
          !now && h("span", {}, durText(x)),
          x.staying && stayTag()),
        x.notes && h("span", { class: "notes" }, x.notes)));
  }

  function renderList() {
    const el = $("#listView");
    el.replaceChildren();
    if (S.status !== "ready" || !S.trips.length) return;
    const t = today();
    const featured = hereToday().length ? null : nextTrip();
    const upcoming = S.trips.filter(x => x.start > t && x !== featured).sort(byStart);
    if (!upcoming.length) el.append(h("p", { class: "sub" }, "Nothing else planned yet."));
    let cur = "";
    for (const x of upcoming) {
      const label = fmt(x.start, { month: "long", year: "numeric" });
      if (label !== cur) { cur = label; el.append(h("h2", { class: "group-h" }, label)); }
      el.append(tripRow(x));
    }
    const past = S.trips.filter(x => x.end < t).sort(byStart).reverse();
    if (past.length) {
      el.append(h("details", { class: "past" },
        h("summary", {}, `Past visits (${past.length})`),
        h("div", { class: "list" }, past.slice(0, 60).map(x => tripRow(x)))));
    }
  }

  function renderCal() {
    const el = $("#calView");
    el.replaceChildren();
    if (S.status !== "ready") { el.append(h("p", { class: "sub" }, "The calendar appears once the family log loads.")); return; }
    const t = today();
    S.month ||= t.slice(0, 7);
    S.selDay ||= t;
    const [y, m] = S.month.split("-").map(Number);
    const first = new Date(y, m - 1, 1);
    const daysIn = new Date(y, m, 0).getDate();
    const rows = Math.ceil((first.getDay() + daysIn) / 7);
    const gridStart = new Date(y, m - 1, 1 - first.getDay());

    const shift = n => { const d = new Date(y, m - 1 + n, 1); S.month = ymd(d).slice(0, 7); renderCal(); };
    el.append(h("div", { class: "cal-head" },
      h("h2", {}, first.toLocaleDateString(undefined, { month: "long", year: "numeric" })),
      h("button", { class: "btn ghost", type: "button", onclick: () => { S.month = t.slice(0, 7); S.selDay = t; renderCal(); } }, "Today"),
      h("button", { class: "btn icon", type: "button", "aria-label": "Previous month", onclick: () => shift(-1) }, "‹"),
      h("button", { class: "btn icon", type: "button", "aria-label": "Next month", onclick: () => shift(1) }, "›")));

    const grid = h("div", { class: "grid" });
    for (let i = 0; i < 7; i++) {
      const d = new Date(gridStart); d.setDate(gridStart.getDate() + i);
      grid.append(h("div", { class: "wd" }, d.toLocaleDateString(undefined, { weekday: "short" })));
    }
    for (let i = 0; i < rows * 7; i++) {
      const d = new Date(gridStart); d.setDate(gridStart.getDate() + i);
      const s = ymd(d);
      const on = S.trips.filter(x => x.start <= s && x.end >= s).sort(byStart);
      const names = uniq(on.flatMap(x => x.people));
      const cls = ["day", d.getMonth() !== m - 1 && "out", s === t && "is-today", s === S.selDay && s !== t && "is-sel"].filter(Boolean).join(" ");
      grid.append(h("button", {
        class: cls, type: "button",
        "aria-label": fmt(s, { weekday: "long", month: "long", day: "numeric" }) + (names.length ? ": " + joinNames(names) : ": nobody"),
        "aria-pressed": s === S.selDay,
        onclick: () => { S.selDay = s; if (s.slice(0, 7) !== S.month) S.month = s.slice(0, 7); renderCal(); },
      },
        h("span", { class: "n" }, String(d.getDate())),
        on.slice(0, 3).map(x => h("span", { class: "bar", style: `--h:${hue(x.people[0])}` }, joinNames(x.people))),
        on.length > 3 && h("span", { class: "more" }, `+${on.length - 3}`)));
    }
    el.append(grid);

    const sel = S.selDay;
    const on = S.trips.filter(x => x.start <= sel && x.end >= sel).sort(byStart);
    el.append(h("div", { class: "dayinfo" },
      h("div", { class: "dayinfo-h" },
        h("h3", {}, fmt(sel, { weekday: "long", month: "long", day: "numeric" })),
        S.canWrite && h("button", { class: "btn", type: "button", onclick: () => openForm(null, sel) }, "Plan a visit this day")),
      on.length ? on.map(x => tripRow(x)) : h("p", { class: "sub" }, "Nobody's planning to be up there.")));
  }

  // ---- trip form ----
  const dlg = $("#dlg");
  let F = null;

  // Everyone the family has named on a visit or a to-do, most-used first.
  function allNames() {
    const count = new Map();
    const bump = p => count.set(p, (count.get(p) || 0) + 1);
    for (const x of S.trips) x.people.forEach(bump);
    for (const t of S.todos) if (t.who) bump(t.who);
    const sorted = [...count.keys()].sort((a, b) => count.get(b) - count.get(a) || a.localeCompare(b));
    return uniq([...sorted, ...(store.get("lastPeople") || []).filter(p => typeof p === "string")]);
  }
  function knownNames() { return uniq([...F.people, ...allNames()]); }

  function openForm(trip, day) {
    if (!trip && !S.canWrite) return;
    const t = today();
    F = trip
      ? { ...trip, people: [...trip.people] }
      : { id: null, people: (store.get("lastPeople") || []).filter(p => typeof p === "string"), start: day || t, end: day || t, reason: "chores", staying: false, notes: "", createdAt: null };
    F.armed = false;
    const ro = !S.canWrite;
    $("#f-title").textContent = ro ? "Trip details" : trip ? "Edit visit" : "Plan a visit";
    $("#f-start").value = F.start;
    $("#f-end").value = F.end;
    $("#f-end").min = F.start;
    $("#f-staying").checked = F.staying;
    $("#f-notes").value = F.notes;
    $("#f-newname").value = "";
    for (const sel of ["#f-start", "#f-end", "#f-staying", "#f-notes", "#f-newname", "#f-addname"]) $(sel).disabled = ro;
    $(".addname").hidden = ro;
    $("#f-save").hidden = ro;
    $("#f-del").hidden = ro || !trip;
    $("#f-del").textContent = "Delete trip";
    $("#f-del").classList.remove("armed");
    $("#f-cancel").textContent = ro ? "Close" : "Cancel";
    $("#f-err").hidden = true;
    renderPeoplePick(); renderReasons(); renderOverlap();
    dlg.showModal();
  }

  // Who's going: chosen people show as chips with a remove button; everyone else
  // the family has used before shows below as "+ Name" chips, filtered by what's typed.
  function renderPeoplePick() {
    const ro = !S.canWrite;
    const going = $("#f-going");
    going.replaceChildren(...F.people.map(n => h("span", { class: "person", style: `--h:${hue(n)}` },
      h("span", { class: "ini", "aria-hidden": "true" }, n[0].toUpperCase()),
      h("span", { class: "nm" }, n),
      !ro && h("button", {
        class: "x", type: "button", "aria-label": `Remove ${n}`,
        onclick: () => { F.people = F.people.filter(p => p !== n); renderPeoplePick(); },
      }, icon("x")))));
    if (!F.people.length) going.append(h("span", { class: "hint" }, "Nobody yet. Tap a name below or type one."));

    const typed = $("#f-newname").value.trim().toLowerCase();
    const chosen = new Set(F.people.map(p => p.toLowerCase()));
    const rest = knownNames().filter(n => !chosen.has(n.toLowerCase()) && (!typed || n.toLowerCase().includes(typed)));
    const sug = $("#f-suggest");
    sug.hidden = ro || !rest.length;
    sug.replaceChildren(...rest.map(n => h("button", {
      class: "opt add", type: "button", "aria-label": `Add ${n}`,
      onclick: () => { F.people = [...F.people, n]; $("#f-newname").value = ""; renderPeoplePick(); },
    }, icon("plus"), n)));
    $("#f-addname").disabled = ro || !typed;
  }

  function addName() {
    const input = $("#f-newname");
    const v = input.value.trim().replace(/\s+/g, " ").slice(0, 40);
    if (!v) return false;
    const existing = knownNames().find(n => n.toLowerCase() === v.toLowerCase());
    const name = existing || v;
    if (!F.people.includes(name)) F.people.push(name);
    input.value = "";
    renderPeoplePick();
    return true;
  }

  function renderReasons() {
    const ro = !S.canWrite;
    $("#f-reasons").replaceChildren(...REASONS.map(r => h("button", {
      class: "opt", type: "button", disabled: ro, "aria-pressed": F.reason === r.id,
      onclick: () => { F.reason = r.id; renderReasons(); },
    }, icon(r.id), r.label)));
  }

  function renderOverlap() {
    const box = $("#f-overlap");
    const others = S.trips.filter(x => x.id !== F.id && x.start <= F.end && x.end >= F.start).sort(byStart);
    box.hidden = !others.length;
    box.replaceChildren(h("strong", {}, "Also up there those days"),
      ...others.map(x => h("span", {}, `${joinNames(x.people)} · ${reasonLabel(x.reason)} · ${rangeText(x)}${x.staying ? " · staying over" : ""}`)));
  }

  function showErr(msg) { const e = $("#f-err"); e.textContent = msg; e.hidden = !msg; }

  function writeError(err) {
    const code = err && err.code;
    if (code === "permission-denied") return "The family log didn't accept that change. Check the names and dates, then try again.";
    if (code === "resource-exhausted") return "The family log has hit its free daily limit. Try again tomorrow.";
    return "Couldn't save that change. Check your connection and try again.";
  }

  $("#f-start").addEventListener("change", e => {
    if (!DATE_RE.test(e.target.value)) return;
    F.start = e.target.value;
    $("#f-end").min = F.start;
    if (F.end < F.start) { F.end = F.start; $("#f-end").value = F.end; }
    renderOverlap();
  });
  $("#f-end").addEventListener("change", e => {
    if (!DATE_RE.test(e.target.value)) return;
    F.end = e.target.value; renderOverlap();
  });
  $("#f-staying").addEventListener("change", e => { F.staying = e.target.checked; });
  $("#f-notes").addEventListener("input", e => { F.notes = e.target.value; });
  $("#f-addname").addEventListener("click", () => { addName(); $("#f-newname").focus(); });
  $("#f-newname").addEventListener("input", renderPeoplePick);
  $("#f-newname").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); addName(); } });
  $("#f-cancel").addEventListener("click", () => dlg.close());
  $("#f-x").addEventListener("click", () => dlg.close());
  dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

  $("#tripForm").addEventListener("submit", async e => {
    e.preventDefault();
    if (!api || !S.family) return;
    addName();
    F.start = $("#f-start").value; F.end = $("#f-end").value;
    if (!F.people.length) return showErr("Pick or add at least one person.");
    if (!DATE_RE.test(F.start) || !DATE_RE.test(F.end)) return showErr("Choose the day you're arriving and the day you're leaving.");
    if (F.end < F.start) return showErr("The leaving day can't be before the arriving day.");
    showErr("");
    const now = Date.now();
    const data = {
      people: F.people, start: F.start, end: F.end, reason: F.reason, staying: F.staying,
      notes: F.notes.trim().slice(0, 500),
      createdAt: F.createdAt || now, updatedAt: now,
    };
    // Firestore applies the write locally right away and syncs when there's signal,
    // so close the form now and only speak up if the server later refuses it.
    const { fs, db } = api;
    const col = fs.collection(db, "families", S.family, "trips");
    fs.setDoc(F.id ? fs.doc(col, F.id) : fs.doc(col), data).catch(err => toast(writeError(err)));
    store.set("lastPeople", F.people);
    const edited = !!F.id;
    dlg.close();
    toast(edited ? "Visit updated" : "Visit added. See you up there!");
  });

  $("#f-del").addEventListener("click", async () => {
    const btn = $("#f-del");
    if (!F.armed) { F.armed = true; btn.textContent = "Tap again to delete"; btn.classList.add("armed"); return; }
    const { fs, db } = api;
    fs.deleteDoc(fs.doc(db, "families", S.family, "trips", F.id)).catch(err => toast(writeError(err)));
    dlg.close();
    toast("Visit deleted");
  });

  // ---- farm to-dos ----
  function cleanTodo(id, d) {
    if (!d || typeof d.text !== "string" || !d.text.trim()) return null;
    return {
      id, text: d.text.trim().slice(0, 200), done: !!d.done,
      who: typeof d.who === "string" ? d.who.trim().slice(0, 40) : "",
      due: DATE_RE.test(d.due) ? d.due : "",
      createdAt: typeof d.createdAt === "number" ? d.createdAt : 0,
      doneAt: typeof d.doneAt === "number" ? d.doneAt : null,
    };
  }
  const openTodos = () => S.todos.filter(t => !t.done).sort((a, b) =>
    (a.due || "9999") < (b.due || "9999") ? -1 : (a.due || "9999") > (b.due || "9999") ? 1 : a.createdAt - b.createdAt);
  const doneTodos = () => S.todos.filter(t => t.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));

  function todoError(err) {
    toast(err && err.code === "permission-denied"
      ? "To-dos need a quick database update from whoever set up Farm Time."
      : writeError(err));
  }
  function saveTodo(t) {
    if (!api || !S.family) return;
    const { fs, db } = api;
    const col = fs.collection(db, "families", S.family, "todos");
    const now = Date.now();
    const data = {
      text: t.text.trim().slice(0, 200), done: !!t.done, who: t.who || "", due: t.due || "",
      createdAt: t.createdAt || now, updatedAt: now, doneAt: t.done ? (t.doneAt || now) : null,
    };
    fs.setDoc(t.id ? fs.doc(col, t.id) : fs.doc(col), data).catch(todoError);
  }

  function dueTag(due) {
    const n = diffDays(today(), due);
    if (n < 0) return h("span", { class: "due late" }, "Overdue · " + fmt(due, SHORT));
    if (n === 0) return h("span", { class: "due" }, "Needed today");
    if (n === 1) return h("span", { class: "due" }, "Needed tomorrow");
    return h("span", { class: "due" }, "Needed by " + fmt(due, SHORT));
  }

  function todoRow(t) {
    return h("div", { class: "todo" + (t.done ? " is-done" : "") },
      h("button", {
        class: "check", type: "button", role: "checkbox", "aria-checked": String(t.done),
        "aria-label": (t.done ? "Mark not done: " : "Mark done: ") + t.text,
        onclick: () => saveTodo({ ...t, done: !t.done, doneAt: null }),
      }, t.done && icon("check")),
      h("button", { class: "todo-body", type: "button", onclick: () => openTodo(t) },
        h("span", { class: "todo-text" }, t.text),
        (t.who || (t.due && !t.done)) && h("span", { class: "meta" }, t.who && chip(t.who), !t.done && t.due && dueTag(t.due))));
  }

  let clearArmed = false;
  function renderTodos() {
    const list = $("#todoList");
    clearArmed = false;
    const open = openTodos(), done = doneTodos();
    $("#todoAdd").hidden = !!S.todosError;
    $("#todoSummary").textContent = S.todosError ? "" : open.length ? `${open.length} open` : done.length ? "All done" : "";
    if (S.todosError) {
      list.replaceChildren(h("p", { class: "sub" }, S.todosError === "permission-denied"
        ? "To-dos aren't switched on yet. Whoever set up Farm Time needs to publish the updated database rules from the setup page."
        : "Couldn't load the to-dos. Check your connection and reload the page."));
      return;
    }
    list.replaceChildren(...open.map(todoRow));
    if (!open.length && !done.length) {
      list.append(h("p", { class: "sub" }, "Nothing on the list. Add jobs that need doing at the farm, like mowing or cutting up fallen trees, so whoever's heading up can take care of them."));
    } else if (!open.length) {
      list.append(h("p", { class: "sub" }, "Everything's done. Nice work."));
    }
    if (done.length) {
      const details = h("details", { class: "done-list" },
        h("summary", {}, `Done (${done.length})`),
        h("div", { class: "todo-list" }, done.slice(0, 50).map(todoRow)),
        h("div", { class: "done-foot" }, h("button", {
          class: "btn ghost", type: "button",
          onclick: e => {
            if (!clearArmed) { clearArmed = true; e.currentTarget.textContent = `Tap again to clear ${done.length}`; return; }
            clearArmed = false;
            const { fs, db } = api;
            const batch = fs.writeBatch(db);
            done.forEach(t => batch.delete(fs.doc(db, "families", S.family, "todos", t.id)));
            batch.commit().catch(todoError);
            toast("Cleared finished to-dos");
          },
        }, "Clear finished")));
      details.open = S.doneOpen;
      details.addEventListener("toggle", () => { S.doneOpen = details.open; });
      list.append(details);
    }
  }

  $("#todoAdd").addEventListener("submit", e => {
    e.preventDefault();
    const input = $("#todoNew");
    const text = input.value.trim();
    if (!text) return;
    saveTodo({ id: null, text, done: false, who: "", due: "" });
    input.value = "";
    input.focus();
  });

  // to-do details dialog
  const tdlg = $("#tdlg");
  let TD = null;
  function renderWho() {
    const names = uniq([...(TD.who ? [TD.who] : []), ...allNames()]);
    $("#t-who").replaceChildren(...names.map(n => h("button", {
      class: "opt", type: "button", "aria-pressed": TD.who === n,
      onclick: () => { TD.who = TD.who === n ? "" : n; renderWho(); },
    }, n)));
    if (!names.length) $("#t-who").append(h("p", { class: "hint" }, "Type a name below, or leave it for anyone."));
  }
  function openTodo(t) {
    TD = { ...t, armed: false };
    $("#t-text").value = t.text;
    $("#t-due").value = t.due || "";
    $("#t-newname").value = "";
    $("#t-del").textContent = "Delete";
    $("#t-del").classList.remove("armed");
    $("#t-err").hidden = true;
    renderWho();
    tdlg.showModal();
  }
  function setWho() {
    const v = $("#t-newname").value.trim().replace(/\s+/g, " ").slice(0, 40);
    if (!v) return;
    TD.who = allNames().find(n => n.toLowerCase() === v.toLowerCase()) || v;
    $("#t-newname").value = "";
    renderWho();
  }
  $("#t-addname").addEventListener("click", setWho);
  $("#t-newname").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); setWho(); } });
  $("#t-clear").addEventListener("click", () => { $("#t-due").value = ""; });
  $("#t-cancel").addEventListener("click", () => tdlg.close());
  $("#t-x").addEventListener("click", () => tdlg.close());
  tdlg.addEventListener("click", e => { if (e.target === tdlg) tdlg.close(); });
  $("#todoForm").addEventListener("submit", e => {
    e.preventDefault();
    setWho();
    const text = $("#t-text").value.trim();
    if (!text) { const er = $("#t-err"); er.textContent = "Describe what needs doing."; er.hidden = false; return; }
    const due = $("#t-due").value;
    saveTodo({ ...TD, text, due: DATE_RE.test(due) ? due : "" });
    tdlg.close();
    toast("To-do saved");
  });
  $("#t-del").addEventListener("click", () => {
    const btn = $("#t-del");
    if (!TD.armed) { TD.armed = true; btn.textContent = "Tap again to delete"; btn.classList.add("armed"); return; }
    const { fs, db } = api;
    fs.deleteDoc(fs.doc(db, "families", S.family, "todos", TD.id)).catch(todoError);
    tdlg.close();
    toast("To-do deleted");
  });

  // ---- top-level controls ----
  $("#addBtn").addEventListener("click", () => openForm());
  $("#tabList").addEventListener("click", () => { S.view = "list"; store.set("view", "list"); render(); });
  $("#tabCal").addEventListener("click", () => { S.view = "cal"; store.set("view", "cal"); render(); });
  $("#tabTodo").addEventListener("click", () => { S.view = "todo"; store.set("view", "todo"); render(); });

  let lastDay = today();
  setInterval(() => { if (today() !== lastDay) { lastDay = today(); render(); } }, 60000);

  render();

  // ---- family code ----
  // The code is never stored or sent as-is: its SHA-256 hash names the family's
  // folder in the database. The database rules (made on setup.html) allow only
  // the one folder that matches the owner's code, so any other code is refused.
  // setup.html hashes codes the same way; keep the two in step.
  async function familyId(code) {
    const norm = code.trim().toLowerCase().replace(/\s+/g, " ");
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("farm-time:" + norm));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  }
  function showCodeErr(msg) { const e = $("#codeErr"); e.textContent = msg; e.hidden = !msg; }

  $("#lockForm").addEventListener("submit", async e => {
    e.preventDefault();
    if (!api) return;
    const code = $("#codeInput").value;
    if (!code.trim()) return showCodeErr("Type the family code first.");
    showCodeErr("");
    const btn = $("#codeBtn");
    btn.disabled = true;
    try {
      const id = await familyId(code);
      const { fs, db } = api;
      // Ask the server directly (not the on-device copy) so a wrong code is never let in offline.
      await fs.getDocsFromServer(fs.query(fs.collection(db, "families", id, "trips"), fs.limit(1)));
      store.set("family", id);
      $("#codeInput").value = "";
      openFamily(id);
    } catch (err) {
      const code = err && err.code;
      if (code === "permission-denied") showCodeErr("That's not the family code. Check with whoever set up Farm Time.");
      else showCodeErr("Couldn't reach the family log. Check your internet connection and try again." + (code ? ` (${code})` : ""));
    } finally {
      btn.disabled = false;
    }
  });

  $("#lockBtn").addEventListener("click", () => {
    unsub?.(); unsub = null;
    unsubTodos?.(); unsubTodos = null;
    store.set("family", null);
    S.family = null; S.trips = []; S.todos = []; S.status = "locked";
    render();
  });

  // ---- connect to the family log (Firebase Firestore) ----
  const FIREBASE = "https://www.gstatic.com/firebasejs/10.12.2/";
  let api = null;
  let unsub = null;
  let unsubTodos = null;

  function openFamily(id) {
    S.family = id; S.status = "loading"; render();
    const { fs, db } = api;
    unsub?.();
    unsub = fs.onSnapshot(fs.collection(db, "families", id, "trips"), snap => {
      S.trips = snap.docs.map(d => clean(d.id, d.data())).filter(Boolean);
      S.status = "ready";
      render();
    }, err => {
      if (err && err.code === "permission-denied") {
        store.set("family", null);
        S.family = null; S.status = "locked"; render();
        showCodeErr("The family code has changed. Enter the new code.");
      } else if (S.status !== "ready") {
        S.status = "error"; render();
      }
    });
    // To-dos live beside the trips. If the database rules predate to-dos, only this list
    // is affected: the trips keep working and the To-dos tab explains what's needed.
    unsubTodos?.();
    unsubTodos = fs.onSnapshot(fs.collection(db, "families", id, "todos"), snap => {
      S.todos = snap.docs.map(d => cleanTodo(d.id, d.data())).filter(Boolean);
      S.todosError = null;
      if (S.status === "ready") render();
    }, err => {
      S.todosError = (err && err.code) || "unavailable";
      if (S.status === "ready") render();
    });
  }

  (async () => {
    const cfg = window.FARM_TIME_CONFIG;
    if (!cfg || !cfg.apiKey || !cfg.projectId) { S.status = "setup"; render(); return; }
    try {
      const [app, fs] = await Promise.all([import(FIREBASE + "firebase-app.js"), import(FIREBASE + "firebase-firestore.js")]);
      const fbApp = app.initializeApp(cfg);
      let db;
      try {
        // Keep a copy on the device so the page opens and takes new trips even with poor signal at the farm.
        db = fs.initializeFirestore(fbApp, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) });
      } catch {
        db = fs.getFirestore(fbApp);
      }
      api = { fs, db };
    } catch {
      S.status = "error"; render(); return;
    }
    const fam = store.get("family");
    if (typeof fam === "string" && /^[0-9a-f]{64}$/.test(fam)) openFamily(fam);
    else { S.status = "locked"; render(); }
  })();
})();
</script>
</body>
</html>
